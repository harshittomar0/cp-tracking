<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>drowl@cp — competitive programming dashboard</title>
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8eae2; --panel:#f5f6f0; --panel2:#eceee6; --line:#c3c6b6; --ink:#1e2a1b; --dim:#5a6352;
  --accent:#8a5600; --accent-ink:#ffffff; --err:#b3261e; --ok:#2e6b1f;
  --cf:#1f63a8; --cc:#7546b8; --ac:#9a5a22;
  --glow:0.0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0b06; --panel:#15100a; --panel2:#1c160d; --line:#3a2e1a; --ink:#f0d9a8; --dim:#a38e63;
    --accent:#ffb000; --accent-ink:#1a1206; --err:#ff7a66; --ok:#a8e07a;
    --cf:#6fb6ff; --cc:#c79bff; --ac:#e7a26a; --glow:1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0b06; --panel:#15100a; --panel2:#1c160d; --line:#3a2e1a; --ink:#f0d9a8; --dim:#a38e63;
  --accent:#ffb000; --accent-ink:#1a1206; --err:#ff7a66; --ok:#a8e07a;
  --cf:#6fb6ff; --cc:#c79bff; --ac:#e7a26a; --glow:1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:calc(var(--glow) * .5);
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px)}
a{color:var(--accent)}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-top:12px;padding-bottom:0}
.prompt{font-family:"VT323","IBM Plex Mono",monospace;font-size:28px;line-height:1;color:var(--accent);white-space:nowrap;
  text-shadow:0 0 calc(var(--glow) * 10px) rgba(255,176,0,.45)}
.prompt .u{color:var(--ok)}
@media (max-width:480px){.prompt{font-size:22px}}
.prompt .cursor{display:inline-block;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.prompt .cursor{animation:none}}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--dim);font-size:12.5px;margin-left:auto;align-items:center}
.status b{color:var(--ink);font-weight:600}
.status .themebtn{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--dim);padding:2px 8px;cursor:pointer}
nav.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;background:none;border:0;color:var(--dim);padding:10px 12px 9px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button::before{content:"$ ";opacity:.5}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button .n{display:inline-block;min-width:18px;padding:0 4px;margin-left:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;text-align:center}

main{padding:20px 0 64px}
section[hidden]{display:none}
h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--ink)}
h2 .c{color:var(--dim);font-weight:400}
h3{font-size:13.5px;font-weight:600;margin:0 0 8px}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}

/* platform cards */
.card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--p);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .pname{color:var(--p);font-weight:600}
.card .handle{font-size:12.5px}
.card .rating{display:flex;align-items:flex-end;gap:14px}
.card .big{font-family:"VT323","IBM Plex Mono",monospace;font-size:76px;line-height:.78;color:var(--p);
  text-shadow:0 0 calc(var(--glow) * 16px) currentColor}
.card .tier{display:flex;flex-direction:column;gap:2px;padding-bottom:4px;font-size:12.5px}
.card .tier .t{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;font-size:13.5px}
.sw{display:inline-block;width:10px;height:10px;background:var(--sw)}
.bar{height:6px;background:var(--line);position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--p)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right}
.zone{font-size:12.5px;border:1px dashed var(--line);padding:6px 8px}
.zone b{color:var(--p)}

/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart .axis{fill:var(--dim);font-size:12px;font-family:"IBM Plex Mono",monospace}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--dim);margin-top:8px}
.insight{border-left:3px solid var(--accent);padding:8px 12px;margin-top:12px;background:var(--panel2)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dim)}
label.f>span b{color:var(--ink);font-weight:500}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{
  font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:7px 9px;width:100%;border-radius:0}
textarea{min-height:66px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--dim);opacity:.75}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.fieldset{margin:0 0 12px;padding:0;border:0}
.fieldset>legend{font-size:12.5px;color:var(--dim);margin-bottom:6px;padding:0}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:3px 9px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip-add{margin-top:6px;max-width:260px}
.btn{font:inherit;font-size:13px;background:transparent;color:var(--accent);border:1px solid var(--accent);padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:var(--line);color:var(--dim)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.sm{padding:3px 9px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.notesgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}

/* entries */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.entry{border:1px solid var(--line);border-left:3px solid var(--p,var(--line));background:var(--panel);margin-bottom:8px}
.entry>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 12px;align-items:baseline}
.entry>summary::-webkit-details-marker{display:none}
.entry>summary::before{content:"▸";color:var(--dim);grid-row:1}
.entry[open]>summary::before{content:"▾"}
.entry .pb{font-size:11px;color:var(--p);border:1px solid var(--p);padding:0 5px}
.entry .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.entry .meta{font-size:12px;color:var(--dim);white-space:nowrap;display:flex;gap:12px}
.entry .tags{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:0 6px}
.tag.m{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.entry .body{padding:4px 14px 14px 30px;display:grid;gap:10px}
.note h4{margin:0 0 2px;font-size:12px;color:var(--dim);font-weight:500}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.outcome{font-size:12px}
.outcome.alone{color:var(--ok)}
.outcome.editorial,.outcome.open{color:var(--err)}
.empty{border:1px dashed var(--line);padding:22px;color:var(--dim);text-align:center}
.empty b{color:var(--ink)}

/* todo */
.todo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .tx{overflow-wrap:anywhere}
.todo.done .tx{text-decoration:line-through;color:var(--dim)}
.pri{font-size:11px;padding:0 5px;border:1px solid var(--line);color:var(--dim)}
.pri.high{color:var(--err);border-color:var(--err)}
.pri.med{color:var(--accent);border-color:var(--accent)}

/* insights */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.stat{background:var(--panel);padding:12px 14px}
.stat .v{font-family:"VT323","IBM Plex Mono",monospace;font-size:42px;line-height:.9;color:var(--accent);text-shadow:0 0 calc(var(--glow) * 10px) rgba(255,176,0,.4)}
.stat .l{font-size:12px;color:var(--dim);margin-top:4px}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:5px}
.hbar .track{height:12px;background:var(--panel2);border:1px solid var(--line)}
.hbar .track i{display:block;height:100%;background:var(--accent)}
.hbar.m .track i{background:var(--err)}
.hbar .c{text-align:right;color:var(--dim)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;width:max-content}
.heat i{display:block;background:var(--line);opacity:.55}
.heat i.l1{background:var(--accent);opacity:.35}
.heat i.l2{background:var(--accent);opacity:.6}
.heat i.l3{background:var(--accent);opacity:.82}
.heat i.l4{background:var(--accent);opacity:1}
.heat i.today{outline:1px solid var(--ink)}
.heat i.future{visibility:hidden}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:480px){.notesgrid{grid-template-columns:1fr}}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.qitem{border:1px solid var(--line);border-left:3px solid var(--p,var(--accent));background:var(--panel);padding:12px;margin-bottom:8px;display:grid;gap:8px}
.qitem .due{font-size:12px}
.qitem .due.over{color:var(--err)}
details.peek>summary{cursor:pointer;color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="prompt" aria-label="drowl at cp"><span class="u">drowl@cp</span>:~$ <span id="cmd">./overview</span><span class="cursor" aria-hidden="true">▌</span></div>
    <div class="status" id="status"></div>
    <nav class="tabs" role="tablist" aria-label="Dashboard sections" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <section id="t-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
  <section id="t-log" role="tabpanel" aria-labelledby="tab-log" hidden></section>
  <section id="t-resolve" role="tabpanel" aria-labelledby="tab-resolve" hidden></section>
  <section id="t-todo" role="tabpanel" aria-labelledby="tab-todo" hidden></section>
  <section id="t-review" role="tabpanel" aria-labelledby="tab-review" hidden></section>
  <section id="t-insights" role="tabpanel" aria-labelledby="tab-insights" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";

/* ---------- platform stats: data/stats.json, refreshed by the GitHub Action ---------- */
/* history rows: [date, contest, newRating, delta, performance] */
const SEED = {"updated":"2026-10-20T07:00:00Z","timezone":"Asia/Kolkata","cf":{"ok":true,"handle":"Squittal","rating":1335,"maxRating":1603,"rank":"pupil","maxRank":"expert","solved":531,"history":[],"daily":{},"tags":{},"ratings":{},"recent":[]},"cc":{"ok":true,"handle":"doctorowl","rating":1942,"max":2007,"stars":4,"global":1640,"country":1353,"contests":17,"solved":95,"history":[]},"ac":{"ok":true,"handle":"drowl","rating":693,"max":824,"rank":25906,"solved":null,"history":[["2023-09-09","ABC319",2,null,35],["2024-01-06","ABC335",7,5,52],["2024-03-09","ABC344",11,4,43],["2024-03-16","ABC345",62,51,846],["2024-03-23","ABC346",165,103,1027],["2024-03-24","ARC175",184,19,334],["2024-05-04","ABC352",231,47,604],["2024-05-11","ABC353",186,-45,35],["2024-05-18","ABC354",275,89,927],["2024-07-06","ABC361",336,61,758],["2024-07-13","ABC362",452,116,1053],["2024-12-07","ABC383",370,-82,47],["2025-02-01","ABC391",487,117,1101],["2025-02-15","ABC393",587,100,1145],["2025-03-08","ABC396",646,59,1014],["2025-03-22","ABC398",696,50,1024],["2025-03-29","ABC399",754,58,1131],["2025-04-05","ABC400",662,-92,37],["2025-05-10","ABC405",577,-85,38],["2025-08-09","ABC418",498,-79,44],["2025-08-16","ABC419",597,99,1191],["2025-08-30","ABC421",771,174,1662],["2025-09-14","ABC423",695,-76,74],["2025-10-11","ABC427",759,64,1193],["2025-12-20","ABC437",824,65,1267],["2026-01-31","ABC443",740,-84,44],["2026-02-07","ABC444",661,-79,52],["2026-03-07","ABC448",711,50,1074],["2026-06-13","ABC462",633,-78,46],["2026-07-25","ABC468",693,60,1116]],"daily":{},"recent":[]}};
let SNAP = SEED;
let STATS_ERR = false;
async function loadStats(){
  try {
    const res = await fetch("data/stats.json?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if (!d || typeof d !== "object" || !d.cf || !d.cc || !d.ac) throw new Error("bad shape");
    for (const k of ["cf","cc","ac"]){ if (!Array.isArray(d[k].history)) d[k].history = []; }
    SNAP = d; STATS_ERR = false;
  } catch(e){ STATS_ERR = true; }
  renderAll();
}
const HANDLE_OK = /^[A-Za-z0-9_.\-]{1,40}$/;
function profileUrl(k){
  const hd = SNAP[k] && SNAP[k].handle; if (!hd || !HANDLE_OK.test(hd)) return null;
  const e = encodeURIComponent(hd);
  return k === "cf" ? "https://codeforces.com/profile/"+e : k === "cc" ? "https://www.codechef.com/users/"+e : "https://atcoder.jp/users/"+e;
}

const TOPICS = ["greedy","math","number theory","dp","binary search","two pointers","prefix sums","sorting",
  "strings","graphs","dfs/bfs","shortest paths","trees","dsu","constructive","bitmasks","combinatorics",
  "implementation","data structures","brute force","games","geometry","interactive"];
const MISTAKES = ["off-by-one","wrong greedy","missed edge case","overflow","tle / complexity","misread statement",
  "wrong observation","implementation bug","forgot reset between tests","wrong data structure","gave up too early","overcomplicated"];
const OUTCOMES = [
  {id:"alone",label:"Solved alone"},{id:"hint",label:"Solved after a hint"},
  {id:"editorial",label:"Needed the editorial"},{id:"upsolve",label:"Upsolved after contest"},{id:"open",label:"Not solved yet"}];
const OUT = Object.fromEntries(OUTCOMES.map(o=>[o.id,o.label]));
const PLAT = {cf:"Codeforces",cc:"CodeChef",ac:"AtCoder",other:"Other"};
const PSHORT = {cf:"CF",cc:"CC",ac:"AC",other:"··"};
const RESOLVE_GAPS = [3,7,30];

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...kids){
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  for (const c of kids.flat()){ if (c == null) continue; e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); }
  return e;
}
function safeUrl(u){ try { const x = new URL(String(u).trim()); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; } catch(e){ return null; } }
function ds(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pd(s){ const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); }
function addDays(s,n){ const d = pd(s); d.setDate(d.getDate()+n); return ds(d); }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function weekStart(s){ const d = pd(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ds(d); }
function mkId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function cut(v,n){ return String(v == null ? "" : v).slice(0,n); }
function fmtDate(s){ const d = pd(s); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"}); }
function plural(n,w){ return n + " " + w + (n === 1 ? "" : "s"); }
function countBy(arr){ const m = new Map(); for (const x of arr) m.set(x,(m.get(x)||0)+1); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
let toastT;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 2600); }

/* ---------- storage: this browser (export a backup to move it) ---------- */
const LKEY = "cpdash.v1";
const TYPES = new Set(["problem","todo","review","meta"]);
function validItem(x){ return x && typeof x === "object" && !Array.isArray(x) && typeof x.id === "string" && x.id.length < 80 && /^[\w-]+$/.test(x.id) && TYPES.has(x.type); }
const Store = {
  items: new Map(), subs: [],
  on(fn){ this.subs.push(fn); },
  emit(){ for (const f of this.subs) { try { f(); } catch(e){ console.error(e); } } },
  all(type){ return [...this.items.values()].filter(x => x && x.type === type); },
  get(id){ return this.items.get(id); },
  init(){
    try { const raw = localStorage.getItem(LKEY); const arr = raw ? JSON.parse(raw) : []; this.items = new Map((Array.isArray(arr)?arr:[]).filter(validItem).map(x=>[x.id,x])); }
    catch(e){ this.items = new Map(); }
    this.emit();
  },
  save(){ try { localStorage.setItem(LKEY, JSON.stringify([...this.items.values()])); } catch(e){ toast("Couldn’t save: browser storage is full or blocked. Export a backup."); } },
  put(item){ item.updated = Date.now(); this.items.set(item.id, item); this.save(); this.emit(); },
  remove(id){ this.items.delete(id); this.save(); this.emit(); },
  exportJSON(){
    const data = JSON.stringify({app:"cp-dashboard", version:1, exported:new Date().toISOString(), items:[...this.items.values()]});

/* ---------- derived data ---------- */
function problems(){ return Store.all("problem").sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.created||0)-(a.created||0)); }
function todos(){ return Store.all("todo"); }
function reviews(){ return Store.all("review").sort((a,b)=> (b.week||"").localeCompare(a.week||"")); }
function meta(){ return Store.get("meta") || {id:"meta", type:"meta", dailyGoal:1}; }
function activity(){
  const m = new Map(); const add = (d,n) => m.set(d,(m.get(d)||0)+n);
  for (const k of ["cf","ac"]){ const d = (SNAP[k] && SNAP[k].daily) || {}; for (const day in d) add(day, +d[day] || 0); }
  const fromPlatforms = new Set(m.keys());
  for (const p of problems()){
    if (p.outcome === "open") continue;
    if (p.platform === "cc" || p.platform === "other" || !fromPlatforms.has(p.date)) add(p.date, 1);
  }
  return m;
}
function streaks(){
  const act = activity(); const set = new Set([...act.keys()].filter(k=>act.get(k)>0)); const today = ds();
  let cur = 0; let d = set.has(today) ? today : addDays(today,-1);
  while (set.has(d)){ cur++; d = addDays(d,-1); }
  const sorted = [...set].sort(); let best = 0, run = 0, prev = null;
  for (const x of sorted){ run = (prev && diffDays(prev,x) === 1) ? run+1 : 1; best = Math.max(best,run); prev = x; }
  return {cur, best};
}
function todayCount(){ return activity().get(ds()) || 0; }
function dueResolves(){ const t = ds(); return problems().filter(p=>p.resolve && !p.resolve.done && p.resolve.due <= t); }
function usedTags(field, presets){ const s = new Set(); for (const p of problems()) for (const t of (p[field]||[])) if (!presets.includes(t)) s.add(t); return [...s]; }

function ratingChart(k){
  const H = chartRows(k); const TT = k === "cf" ? CF_T : k === "cc" ? CC_T : AC_T;
  if (H.length < 2) return h("div",{class:"empty"},"No rating history for "+PLAT[k]+" yet. It appears after the next stats update.");
  const W = 600, Hh = 250, L = 44, R = 12, T = 12, B = 30;
  const vals = H.map(r => +r[2]);
  const lo = Math.max(0, Math.floor((Math.min(...vals)-100)/200)*200), hi = Math.ceil((Math.max(...vals)+100)/200)*200;
  const t0 = pd(H[0][0]).getTime(); let t1 = pd(H[H.length-1][0]).getTime(); if (t1 === t0) t1 = t0 + 86400000;
  const x = d => L + (pd(d).getTime()-t0)/(t1-t0)*(W-L-R);
  const y = v => T + (1 - (v-lo)/(hi-lo))*(Hh-T-B);
  const last = H[H.length-1];
  const g = sv("svg",{viewBox:"0 0 "+W+" "+Hh, role:"img", "aria-label":PLAT[k]+" rating history over "+H.length+" contests, now "+last[2]+", peak "+Math.max(...vals)+"."});
  for (let i=0;i<TT.length;i++){
    const a = Math.max(TT[i][0], lo), b = Math.min(TT[i+1] ? TT[i+1][0] : Infinity, hi);
    if (b <= a) continue;
    g.appendChild(sv("rect",{x:L, y:y(b), width:W-L-R, height:y(a)-y(b), fill:TT[i][2], opacity:"0.1"}));
    if (y(a)-y(b) > 18) g.appendChild(sv("text",{x:W-R-4, y:y(b)+14, "text-anchor":"end", class:"axis"}, TT[i][1]));
  }
  const step = (hi-lo) <= 800 ? 200 : 400;
  for (let v = lo; v <= hi; v += step){
    g.appendChild(sv("line",{x1:L, x2:W-R, y1:y(v), y2:y(v), stroke:"var(--line)", "stroke-width":"1"}));
    g.appendChild(sv("text",{x:L-6, y:y(v)+4, "text-anchor":"end", class:"axis"}, v));
  }
  for (let yr = pd(H[0][0]).getFullYear()+1; yr <= pd(last[0]).getFullYear(); yr++){
    const xx = x(yr+"-01-01");
    g.appendChild(sv("line",{x1:xx,x2:xx,y1:T,y2:Hh-B, stroke:"var(--line)", "stroke-dasharray":"2 4"}));
    g.appendChild(sv("text",{x:xx, y:Hh-10, "text-anchor":"middle", class:"axis"}, yr));
  }
  g.appendChild(sv("polyline",{points:H.map(r => x(r[0]).toFixed(1)+","+y(+r[2]).toFixed(1)).join(" "), fill:"none", stroke:"var(--"+k+")", "stroke-width":"2", "stroke-linejoin":"round"}));
  for (const r of H){
    const tip = String(r[1])+" ("+r[0]+"): rating "+r[2]+(r[3]==null ? "" : " ("+signed(+r[3])+")")+(r[4]==null ? "" : ", performance "+r[4]);

      : sv("circle",{cx:x(r[0]), cy:y(+r[2]), r:3.5, fill:"var(--"+k+")"});
    node.appendChild(sv("title",null,tip)); g.appendChild(node);
  }
  return g;
}

/* ---------- chip group ---------- */
function chipGroup(presets, opts){
  opts = opts || {};
  const multi = opts.multi !== false;
  let sel = new Set(); let extra = [];
  const list = h("div",{class:"chip-list"});
  const wrap = h("div",null, list);
  const val = p => typeof p === "string" ? p : p.id;
  const lab = p => typeof p === "string" ? p : p.label;
  let input = null;
  if (opts.custom){
    input = h("input",{type:"text", class:"chip-add", maxlength:"40", placeholder:"add your own, then Enter", "aria-label":"Add a custom "+(opts.label||"tag")});
    input.addEventListener("keydown", e => {
      if (e.key !== "Enter") return; e.preventDefault();
      const v = input.value.trim().toLowerCase().slice(0,40); if (!v) return;
      if (!presets.some(p=>val(p)===v) && !extra.includes(v)) extra.push(v);
      sel.add(v); input.value = ""; draw();
    });
    wrap.appendChild(input);
  }
  function draw(){
    list.replaceChildren(...[...presets, ...extra].map(p => {
      const v = val(p), on = sel.has(v);
      return h("button",{type:"button", class:"chip", "aria-pressed":String(on), onclick:()=>{
        if (multi){ if (on) sel.delete(v); else sel.add(v); } else sel = new Set([v]);
        draw(); if (opts.onchange) opts.onchange(api.get());
      }}, lab(p));
    }));
  }
  const api = {
    el: wrap,
    get(){ return multi ? [...sel] : ([...sel][0] || null); },
    set(v){ sel = new Set(multi ? (v||[]) : (v ? [v] : [])); for (const x of sel) if (!presets.some(p=>val(p)===x) && !extra.includes(x)) extra.push(x); draw(); },
    addExtras(arr){ for (const x of arr) if (!presets.some(p=>val(p)===x) && !extra.includes(x)) extra.push(x); draw(); }
  };
  draw(); return api;
}

}

  for (let i=0;i<16*7;i++){
    const d = addDays(start,i); const c = counts.get(d)||0;
    const lv = c===0?0:c===1?1:c===2?2:c===3?3:4;
    cells.push(h("i",{class:(lv?"l"+lv:"")+(d===t?" today":"")+(d>t?" future":""), title: fmtDate(d)+": "+plural(c,"problem")}));
  }
  return h("div",{class:"heat-wrap"}, h("div",{class:"heat", role:"img", "aria-label":"Solves per day over the last 16 weeks"}, cells));
}
function renderInsights(){
  const el = document.getElementById("t-insights");
  const ps = problems(); const solved = ps.filter(p=>p.outcome!=="open");
  const st = streaks();
  const help = ps.filter(p=>["hint","editorial"].includes(p.outcome)).length;
  const timed = ps.filter(p=>p.minutes!=null && p.minutes>0);
  const avgMin = timed.length ? Math.round(timed.reduce((s,p)=>s+p.minutes,0)/timed.length) : null;
  const zcf = zone(+SNAP.cf.rating||0);
  const cfRecent = (SNAP.cf.recent||[]).filter(r=>r && isFinite(+r.rating) && r.rating);
  const cfNum = cfRecent.length ? cfRecent.map(r=>({diff:String(r.rating)})) : ps.filter(p=>p.platform==="cf" && /^\d{3,4}$/.test(p.diff||""));
  const inZone = cfNum.filter(p=>+p.diff>=zcf[0] && +p.diff<=zcf[1]).length;
  const below = cfNum.filter(p=>+p.diff<zcf[0]).length;
  const mist = countBy(ps.flatMap(p=>p.mistakes||[])).slice(0,8);
  const top = countBy(solved.flatMap(p=>p.topics||[])).slice(0,12);
  const usedT = new Set(solved.flatMap(p=>p.topics||[]));
  const gaps = TOPICS.filter(t=>!usedT.has(t) && !["interactive","geometry","games"].includes(t));
  const lowConf = countBy(ps.filter(p=>p.confidence && +p.confidence<=2).flatMap(p=>p.topics||[])).slice(0,5);
  el.replaceChildren(
    h("div",{class:"stats"},
      [[ps.length,"problems logged"],[st.cur+"d","current streak"],[st.best+"d","longest streak"],
       [ps.length ? Math.round(help/ps.length*100)+"%" : "–","needed a hint or editorial"],
       [avgMin!=null ? avgMin+"m" : "–","average time per problem"],
       [cfNum.length ? Math.round(inZone/cfNum.length*100)+"%" : "–",(cfRecent.length ? "of last "+cfRecent.length+" CF solves" : "CF solves")+" in "+zcf[0]+"–"+zcf[1]]]
      .map(([v,l])=>h("div",{class:"stat"}, h("div",{class:"v"},String(v)), h("div",{class:"l"},l)))),
    cfNum.length && below/cfNum.length > 0.5 ? h("div",{class:"insight small", style:"margin:-4px 0 16px"},
      "Most of your recent Codeforces solves are below "+zcf[0]+". Problems in the "+zcf[0]+"–"+zcf[1]+" range are where rating growth comes from.") : null,
    h("div",{class:"panel"}, h("h2",null,"Daily practice ", h("span",{class:"c"},"· last 16 weeks, platforms plus your log")), heatmap()),
    ps.length ? h("div",{class:"grid2"},
      h("div",{class:"panel"}, h("h2",null,"Your recurring mistakes"),
        mist.length ? hbars(mist, mist[0][1], "m") : h("p",{class:"dim small", style:"margin:0"},"Tag mistakes when you log problems and patterns will show up here."),
        mist.length ? h("p",{class:"small", style:"margin:10px 0 0"}, h("span",{class:"dim"},"Biggest lever right now: "), h("b",null,mist[0][0]), ". Make one checklist step for it and run it before every submit.") : null),
      h("div",{class:"panel"}, h("h2",null,"Topics you’ve solved"),
        top.length ? hbars(top, top[0][1]) : h("p",{class:"dim small", style:"margin:0"},"Tag topics on your entries to see coverage."),
        gaps.length && top.length ? h("p",{class:"small", style:"margin:10px 0 0"}, h("span",{class:"dim"},"Not logged yet: "), gaps.slice(0,8).join(", ")) : null,
        lowConf.length ? h("p",{class:"small", style:"margin:6px 0 0"}, h("span",{class:"dim"},"Low confidence in: "), lowConf.map(x=>x[0]).join(", ")) : null))
      : h("div",{class:"empty"}, h("b",null,"Insights fill in as you log."), h("br"), "Five or six entries with mistake and topic tags are enough to see your first patterns."),
    cfPanels()
  );
}

function cfPanels(){
  const tags = Object.entries(SNAP.cf.tags||{}).filter(([k,v])=>isFinite(+v)).map(([k,v])=>[mapTag(k),+v]).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const rts = Object.entries(SNAP.cf.ratings||{}).filter(([k,v])=>/^\d+$/.test(k) && isFinite(+v)).map(([k,v])=>[k,+v]).sort((a,b)=>+a[0]-+b[0]);
  if (!tags.length && !rts.length) return null;
  const maxR = Math.max(1,...rts.map(r=>r[1])); const maxT = Math.max(1,...tags.map(r=>r[1]));
  return h("div",{class:"grid2", style:"margin-top:16px"},
    tags.length ? h("div",{class:"panel"}, h("h2",null,"Codeforces solves by tag ", h("span",{class:"c"},"· all time")), hbars(tags, maxT)) : null,
    rts.length ? h("div",{class:"panel"}, h("h2",null,"Codeforces solves by problem rating"), hbars(rts, maxR),
      h("p",{class:"small dim", style:"margin:10px 0 0"},"Your practice zone is "+zone(+SNAP.cf.rating||0).join("–")+". Aim for most new solves to land there.")) : null);
}

/* ---------- boot ---------- */
try { const th = localStorage.getItem("cpdash.theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch(e){}
buildTabs(); buildLog(); resetForm(); buildTodo(); buildReview();
function renderAll(){ renderStatus(); renderOverview(); renderLogList(); renderResolve(); renderTodo(); renderReview(); renderInsights(); buildTabs(); }
Store.on(renderAll);
Store.init();
loadStats();
})();
